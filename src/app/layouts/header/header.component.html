<header>
    <div class="topic">
        @if(topic().length) {
            <h4 class="subject">
                <app-icon [type]="topic()" [size]="isMobileView() ? 'medium' : 'large'"></app-icon>
                {{ topic() }}
            </h4>
        }
    </div>
    <theme-switch [isMobileView]="isMobileView()" (themeChanged)="onThemeChanged()"></theme-switch>
</header>
